[package]
name = "timeslay-migrate"
version = "0.17.1"
edition = "2024"
description = "One-off moves of old TimeSlay data, run by hand"
license = "MPL-2.0"
publish = false

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std", "serde"] }
serde_json = "1.0.145"
timeslay = { path = ".." }
urlencoding = "2.1.3"

# Each runs in plan mode, then again with --apply.
# Moves the legacy time-block/task calendars into TimeSlay.
[[example]]
name = "migrate_calendar"

# Moves the Google Tasks "Habits & Recurring" list into Calendar habits.
[[example]]
name = "migrate_task_habits"

# Moves files older builds kept into the local database, without opening the app.
[[example]]
name = "migrate_local_data"
