[package]
name = "timeslay-core"
version = "0.17.0"
edition = "2024"
description = "Slay the day with TimeSlay"
license = "MPL-2.0"

[dependencies]
base64 = { version = "0.22.1", default-features = false, features = ["alloc", "std"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std", "serde"] }
directories = "6.0.0"
iana-time-zone = "0.1"
getrandom = { version = "0.3.3", default-features = false, features = ["std"] }
# The data layer only needs Color.
iced_core = { version = "0.14", default-features = false }
log = "0.4.34"
notify = "8.2.0"
# Parses note bodies; the HTML renderer is not needed.
pulldown-cmark = { version = "0.13", default-features = false }
rusqlite = { version = "0.41.0", features = ["bundled", "backup"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
turso = { version = "=0.8.3", default-features = false, features = ["sync"] }
tokio = { version = "1", features = ["rt", "time", "net"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = { version = "0.10.9", default-features = false }
tempfile = "3"
toml = "1.1.6"
ureq = { version = "2.12.1", default-features = false, features = ["tls", "json"] }
urlencoding = "2.1.3"

[target.'cfg(target_os = "android")'.dependencies]
# Opens the OAuth Intent on the phone.
webbrowser = "1"
jni = "0.21"
ndk-context = "0.1"
