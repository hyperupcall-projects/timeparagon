name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  android:
    name: Android release APK
    runs-on: ubuntu-24.04
    environment: Release
    env:
      CARGO_BUILD_JOBS: "2"
      TIMESLAY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      TIMESLAY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      TIMESLAY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Check signing secrets
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || { echo "::error::Missing secret $name"; exit 1; }
          done
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall
      - run: cargo binstall --no-confirm dioxus-cli@0.7.10
      - name: Build signed release APK
        run: |
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          TIMESLAY_KEYSTORE="$keystore" scripts/build-android.sh --release --abi arm64 --output dist
          rm -f "$keystore"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Name release asset
        run: |
          mv dist/timeslay-arm64-v8a-release.apk "dist/timeslay-arm64-v8a-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  linux:
    name: Linux release binary
    runs-on: ubuntu-24.04
    environment: Release
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake pkg-config \
            libpipewire-0.3-dev libspa-0.2-dev libxkbcommon-dev libwayland-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev \
            libasound2t64 libnss3 libgbm1
      - run: cargo build --release --locked --bin timeslay
      - name: Package binary
        run: |
          name="timeslay-x86_64-linux-${GITHUB_REF_NAME}"
          cef=$(ls -d target/release/build/cef-dll-sys-*/out/cef_linux_* | head -n 1)
          [ -f "$cef/libcef.so" ] || { echo "::error::CEF runtime not found"; exit 1; }
          mkdir -p dist "pkg/$name/bin" "pkg/$name/lib/timeslay/cef"
          # The binary loads CEF from ../lib/timeslay/cef relative to itself.
          cp target/release/timeslay "pkg/$name/bin/timeslay"
          cp -aL "$cef/." "pkg/$name/lib/timeslay/cef/"
          cp target/release/timeslay "dist/$name"
          tar -C pkg -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [android, linux]
    runs-on: ubuntu-24.04
    environment: Release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          prerelease=
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" $prerelease --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME" dist/*
        env:
          GH_TOKEN: ${{ github.token }}
