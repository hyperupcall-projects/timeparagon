name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Same version as rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt
      # Explicit packages avoid traversing excluded vendored dependencies.
      - run: cargo fmt -p timeparagon -p timeparagon-core -p timeparagon-dioxus -- --check

  rust-tests:
    name: Rust tests
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      # Same version as rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      # Includes compiled dependencies and CEF's download in target/*/build.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake pkg-config faketime \
            libpipewire-0.3-dev libspa-0.2-dev libxkbcommon-dev libwayland-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev \
            libasound2t64 libnss3 libgbm1
      - run: cargo test --workspace --locked
        id: tests
      # Reuse the same build for all four fake-clock runs. Keep running these
      # after ordinary test failures, as the separate job did.
      - name: Rust tests on daylight saving days
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: scripts/test-daylight-saving.sh

  # clippy:
  #   name: Clippy
  #   runs-on: ubuntu-24.04
  #   env:
  #     CARGO_BUILD_JOBS: "2"
  #     CARGO_PROFILE_DEV_DEBUG: "0"
  #   steps:
  #     - uses: actions/checkout@v7
  #     # Same version as rust-toolchain.toml.
  #     - uses: dtolnay/rust-toolchain@master
  #       with:
  #         toolchain: 1.100.0
  #         components: clippy
  #     - name: Install native dependencies
  #       run: |
  #         sudo apt-get update
  #         sudo apt-get install -y --no-install-recommends \
  #           clang cmake pkg-config \
  #           libpipewire-0.3-dev libspa-0.2-dev libxkbcommon-dev libwayland-dev \
  #           libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev \
  #           libasound2t64 libnss3 libgbm1
  #     - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  slack-tests:
    name: Slack tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: slack/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: slack
      - run: npm test
        working-directory: slack
