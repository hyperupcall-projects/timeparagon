  #           clang cmake pkg-config \
  #           libpipewire-0.3-dev libspa-0.2-dev libxkbcommon-dev libwayland-dev \
  #           libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev \
  #           libasound2t64 libnss3 libgbm1
  #     - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  daylight-saving:
    name: Rust tests on daylight saving days
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake pkg-config \
            libpipewire-0.3-dev libspa-0.2-dev libxkbcommon-dev libwayland-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev \
            libasound2t64 libnss3 libgbm1
      - run: sudo apt-get install -y --no-install-recommends faketime
      - run: scripts/test-daylight-saving.sh

  script-tests:
    name: JavaScript and Python tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: slack/package-lock.json
      - run: npm ci
        working-directory: slack
      - run: npm test
        working-directory: slack
      - run: node tests/map_picker.mjs
      - run: python3 packaging/test_install.py
      - run: python3 scripts/test_clippy_fix.py
